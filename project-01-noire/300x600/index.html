<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=300,height=600">
  <title>NOIRÉ — FW26 Campaign (300x600)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <a id="ad-banner" class="banner" href="https://www.behance.net/ronaldspizarro" target="_blank" rel="noopener">
    
    
    <div class="bg-base"></div>
    <div class="bg-grain"></div>

    
    <header class="ad-header">
      <div class="header-top">
        <div class="logo-wrapper">
          <img class="logo-img" src="assets/logo.svg" alt="NOIRÉ">
        </div>
        <div class="season-badge">FW26</div>
      </div>
      <div class="header-divider"></div>
      <div class="header-eyebrow">CONTEMPORARY LUXURY</div>
    </header>

    
    <div class="visual-wrapper">
      <div class="visual-inner">
        <img id="hero-img" class="hero-image" src="assets/hero.webp" alt="NOIRÉ FW26 Campaign Silhouette">
        <div class="visual-overlay"></div>
      </div>
      <div class="visual-frame-border"></div>
      <div class="visual-tag">01 / SILHOUETTE</div>
    </div>

    
    <div class="ad-footer">
      <div class="headline">
        <div class="mask-wrap">
          <span class="h-line line-1">THE NEW</span>
        </div>
        <div class="mask-wrap">
          <span class="h-line line-2">STANDARD.</span>
        </div>
      </div>

      <div class="subheadline-row">
        <div class="hairline-divider"></div>
        <span class="subheadline">FALL / WINTER 2026</span>
      </div>

      
      <div class="cta-wrapper">
        <div class="cta-btn">
          <span class="cta-text">EXPLORE COLLECTION</span>
          <svg class="cta-arrow" width="13" height="11" viewBox="0 0 13 11" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.5 1.5L11.5 5.5M11.5 5.5L7.5 9.5M11.5 5.5H1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="cta-sheen"></span>
        </div>
      </div>
    </div>

    
    <div class="ad-border"></div>
  </a>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
