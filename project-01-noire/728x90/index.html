<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=728,height=90">
  <title>NOIRÉ — FW26 Campaign (728x90)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <a id="ad-banner" class="banner" href="https://www.linkedin.com/in/ronald-santamaria-pizarro/" target="_blank" rel="noopener">
    
    
    <div class="bg-base"></div>
    <div class="bg-grain"></div>

    
    <div class="visual-wrapper">
      <div class="visual-inner">
        <img id="hero-img" class="hero-image" src="assets/hero.webp" alt="NOIRÉ FW26 Collection">
        <div class="visual-overlay"></div>
      </div>
      <div class="visual-accent-border"></div>
    </div>

    
    <div class="ad-layout">
      
      <div class="brand-block">
        <div class="logo-wrapper">
          <img class="logo-img" src="assets/logo.svg" alt="NOIRÉ">
        </div>
        <div class="v-separator"></div>
        <div class="season-tag">FW26</div>
      </div>

      
      <div class="copy-block">
        <div class="headline-mask">
          <h1 class="headline-text">THE NEW STANDARD.</h1>
        </div>
        <div class="sub-wrapper">
          <span class="sub-bullet">/</span>
          <span class="subheadline">FALL / WINTER 2026</span>
        </div>
      </div>

      
      <div class="cta-block">
        <div class="cta-btn">
          <span class="cta-text">EXPLORE COLLECTION</span>
          <svg class="cta-arrow" width="11" height="9" viewBox="0 0 11 9" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.5 1L10 4.5M10 4.5L6.5 8M10 4.5H1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="cta-sheen"></span>
        </div>
      </div>
    </div>

    
    <div class="ad-border"></div>
  </a>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
