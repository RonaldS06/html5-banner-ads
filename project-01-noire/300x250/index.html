<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=300,height=250">
  <title>NOIRÉ — FW26 Campaign (300x250)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a id="ad-banner" class="banner" href="https://github.com/RonaldS06" target="_blank" rel="noopener">
    <div class="bg-base"></div>
    <div class="bg-grain"></div>

    <div class="visual-wrapper">
      <div class="visual-inner">
        <img id="hero-img" class="hero-image" src="assets/hero.webp" alt="NOIRÉ FW26 Collection">
        <div class="visual-overlay"></div>
      </div>
      <div class="visual-accent-border"></div>
    </div>

    <header class="ad-header">
      <div class="logo-wrapper">
        <img class="logo-img" src="assets/logo.svg" alt="NOIRÉ">
      </div>
      <div class="season-badge">FW26</div>
    </header>

    <div class="ad-content">
      <div class="headline">
        <div class="mask-wrap">
          <span class="h-line line-1">THE NEW</span>
        </div>
        <div class="mask-wrap">
          <span class="h-line line-2">STANDARD.</span>
        </div>
      </div>

      <div class="subheadline-wrapper">
        <div class="hairline-divider"></div>
        <span class="subheadline">FALL / WINTER 2026</span>
      </div>

      <div class="cta-wrapper">
        <div class="cta-btn">
          <span class="cta-text">EXPLORE COLLECTION</span>
          <svg class="cta-arrow" width="12" height="10" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 1L11 5M11 5L7 9M11 5H1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="cta-sheen"></span>
        </div>
      </div>
    </div>

    <div class="ad-border"></div>
  </a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
