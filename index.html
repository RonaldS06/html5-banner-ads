<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 - Banner Ads | Ronald Santamaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="showcase.css" />
  </head>
  <body class="theme-dark">
    <header class="showcase-nav">
      <div class="nav-brand">
        <div class="campaign-nav" aria-label="Campaign Switcher">
          <button
            id="btn-prev-project"
            class="c-nav-btn"
            aria-label="Previous Campaign"
            title="Previous Campaign"
          >
            <svg
              width="11"
              height="11"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <div class="c-nav-indicators">
            <button
              class="c-indicator active"
              data-index="0"
              title="Project 01"
            >
              01
            </button>
            <span class="c-divider">/</span>
            <button class="c-indicator" data-index="1" title="Project 02">
              02
            </button>
          </div>

          <button
            id="btn-next-project"
            class="c-nav-btn"
            aria-label="Next Campaign"
            title="Next Campaign"
          >
            <svg
              width="11"
              height="11"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="brand-text">
          <h1 class="brand-title">
            <span id="proj-title">NOIRÉ</span>
            <span id="proj-tagline">— THE NEW STANDARD</span>
          </h1>
          <div class="nav-meta">
            <span class="tech-stack-tag"
              ><strong>STACK:</strong>
              <span id="proj-stack"
                >HTML5 · CSS3 · JavaScript · GSAP</span
              ></span
            >
          </div>
        </div>
      </div>

      <div class="nav-controls">
        <div
          class="control-group bg-switcher"
          title="Test 1px ad border contrast against dark & light publisher backgrounds"
        >
          <span class="control-label">SURFACE:</span>
          <button id="btn-dark" class="mode-btn active" data-theme="theme-dark">
            OBSIDIAN
          </button>
          <button id="btn-light" class="mode-btn" data-theme="theme-light">
            LIGHT
          </button>
        </div>

        <button
          id="btn-replay-all"
          class="action-btn primary-btn"
          title="Replay all banners simultaneously"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          <span>REPLAY ALL</span>
        </button>
      </div>
    </header>

    <main class="showcase-canvas">
      <section class="banner-display display-728">
        <div class="banner-caption">
          <span class="format-name">LEADERBOARD</span>
          <span class="format-size">728 × 90</span>
          <div class="caption-actions">
            <button
              class="icon-btn replay-single"
              data-target="frame-728"
              title="Replay this banner"
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              Replay
            </button>
            <a
              id="link-728"
              class="icon-btn"
              href="project-01-noire/728x90/index.html"
              target="_blank"
              rel="noopener"
              title="Open standalone banner"
            >
              <svg
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              Standalone
            </a>
          </div>
        </div>

        <div class="banner-frame-wrap">
          <iframe
            id="frame-728"
            class="ad-frame"
            src="project-01-noire/728x90/index.html"
            width="728"
            height="90"
            frameborder="0"
            scrolling="no"
            title="NOIRÉ 728x90 Banner"
          ></iframe>
        </div>
      </section>

      <div class="dual-gallery">
        <section class="banner-display display-600">
          <div class="banner-caption">
            <span class="format-name">HALF PAGE / FILMSTRIP</span>
            <span class="format-size">300 × 600</span>
            <div class="caption-actions">
              <button
                class="icon-btn replay-single"
                data-target="frame-600"
                title="Replay this banner"
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
                Replay
              </button>
              <a
                id="link-600"
                class="icon-btn"
                href="project-01-noire/300x600/index.html"
                target="_blank"
                rel="noopener"
                title="Open standalone banner"
              >
                <svg
                  width="11"
                  height="11"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                  />
                  <polyline points="15 3 21 3 21 9" />
                  <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
                Standalone
              </a>
            </div>
          </div>

          <div class="banner-frame-wrap">
            <iframe
              id="frame-600"
              class="ad-frame"
              src="project-01-noire/300x600/index.html"
              width="300"
              height="600"
              frameborder="0"
              scrolling="no"
              title="NOIRÉ 300x600 Banner"
            ></iframe>
          </div>
        </section>

        <section class="banner-display display-250">
          <div class="banner-caption">
            <span class="format-name">MEDIUM RECTANGLE</span>
            <span class="format-size">300 × 250</span>
            <div class="caption-actions">
              <button
                class="icon-btn replay-single"
                data-target="frame-250"
                title="Replay this banner"
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
                Replay
              </button>
              <a
                id="link-250"
                class="icon-btn"
                href="project-01-noire/300x250/index.html"
                target="_blank"
                rel="noopener"
                title="Open standalone banner"
              >
                <svg
                  width="11"
                  height="11"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                  />
                  <polyline points="15 3 21 3 21 9" />
                  <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
                Standalone
              </a>
            </div>
          </div>

          <div class="banner-frame-wrap">
            <iframe
              id="frame-250"
              class="ad-frame"
              src="project-01-noire/300x250/index.html"
              width="300"
              height="250"
              frameborder="0"
              scrolling="no"
              title="NOIRÉ 300x250 Banner"
            ></iframe>
          </div>
        </section>
      </div>
    </main>

    <footer class="showcase-footer">
      <p>
        Crafted with love by
        <a
          href="https://www.linkedin.com/in/ronald-santamaria-pizarro/"
          target="_blank"
          rel="noopener"
          >Ronald Santamaria</a
        >
        <span class="heart-icon">❤️</span> &nbsp;·&nbsp;
        <a
          href="https://www.behance.net/ronaldspizarro"
          target="_blank"
          rel="noopener"
          >Behance</a
        >
        &nbsp;·&nbsp;
        <a href="https://github.com/RonaldS06" target="_blank" rel="noopener"
          >GitHub</a
        >
      </p>
    </footer>

    <script src="showcase.js"></script>
  </body>
</html>
