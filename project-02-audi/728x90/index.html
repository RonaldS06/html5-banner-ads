<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=728,height=90">
  <title>Audi A5 Sportback — 728x90</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a id="ad-banner" class="banner" href="javascript:void(0)">
    
    <div class="road-parallax-wrap">
      <img class="road-bg" src="assets/road-wide.webp" alt="Audi Performance Track">
      <div class="road-vignette"></div>
    </div>

    <div class="ad-layout">
      <div class="brand-copy-block">
        <div class="brand-logo">
          <svg viewBox="0 0 160 58" width="54" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#ffffff" stroke-width="4.5">
              <circle cx="27" cy="29" r="23"/>
              <circle cx="62" cy="29" r="23"/>
              <circle cx="98" cy="29" r="23"/>
              <circle cx="133" cy="29" r="23"/>
            </g>
          </svg>
        </div>
        <div class="v-divider"></div>
        <div class="copy-stack">
          <div class="headline-mask">
            <span class="headline-text">AUDI A5 SPORTBACK</span>
          </div>
          <div class="sub-mask">
            <span class="subheadline-text">PERFORMANCE MEETS ELEGANCE</span>
          </div>
        </div>
      </div>

      <div class="car-stage">
        <div class="car-item car-black active">
          <img src="assets/car-black.webp" alt="Audi A5 Sportback Mythos Black">
        </div>
        <div class="car-item car-white">
          <img src="assets/car-white.webp" alt="Audi A5 Sportback Glacier White">
        </div>
      </div>

      <div class="actions-block">
        <div class="color-swatches" title="Switch car color">
          <button class="swatch-btn swatch-black active" data-color="black" aria-label="Mythos Black"></button>
          <button class="swatch-btn swatch-white" data-color="white" aria-label="Glacier White"></button>
        </div>

        <div class="cta-wrapper">
          <div class="cta-btn">
            <span class="cta-text">CONFIGURAR</span>
            <svg class="cta-arrow" width="11" height="9" viewBox="0 0 11 9" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6.5 1L10 4.5M10 4.5L6.5 8M10 4.5H1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="ad-border"></div>
  </a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
