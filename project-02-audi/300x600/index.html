<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=300,height=600">
  <title>Audi A5 Sportback — 300x600</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a id="ad-banner" class="banner" href="https://github.com/RonaldS06" target="_blank" rel="noopener">
    
    <div class="road-parallax-wrap">
      <img class="road-bg" src="assets/pista.webp" alt="Audi Performance Track">
      <div class="road-vignette"></div>
    </div>

    <div class="audi-watermark-rings">
      <svg viewBox="0 0 160 58" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="4">
          <circle cx="27" cy="29" r="23"/>
          <circle cx="62" cy="29" r="23"/>
          <circle cx="98" cy="29" r="23"/>
          <circle cx="133" cy="29" r="23"/>
        </g>
      </svg>
    </div>

    <header class="ad-header">
      <div class="brand-logo">
        <svg viewBox="0 0 160 58" width="68" height="25" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#ffffff" stroke-width="4.5">
            <circle cx="27" cy="29" r="23"/>
            <circle cx="62" cy="29" r="23"/>
            <circle cx="98" cy="29" r="23"/>
            <circle cx="133" cy="29" r="23"/>
          </g>
        </svg>
      </div>
      <div class="copy-stack">
        <div class="headline-mask">
          <span class="headline-text">AUDI A5 SPORTBACK</span>
        </div>
        <div class="sub-mask">
          <span class="subheadline-text">PERFORMANCE MEETS ELEGANCE</span>
        </div>
      </div>
    </header>

    <div class="car-stage">
      <div class="car-item car-black active">
        <img src="assets/car-black.webp" alt="Audi A5 Sportback Mythos Black">
      </div>
      <div class="car-item car-white">
        <img src="assets/car-white.webp" alt="Audi A5 Sportback Glacier White">
      </div>
    </div>

    <div class="ad-footer">
      <div class="specs-badge">
        <span>QUATTRO</span>
        <span class="dot">·</span>
        <span>S TRONIC</span>
        <span class="dot">·</span>
        <span>MATRIX LED</span>
      </div>

      <div class="color-selector-wrap">
        <span class="selector-label">COLOR:</span>
        <div class="color-swatches" title="Switch car color">
          <button class="swatch-btn swatch-black active" data-color="black" aria-label="Mythos Black"></button>
          <button class="swatch-btn swatch-white" data-color="white" aria-label="Glacier White"></button>
        </div>
      </div>

      <div class="cta-wrapper">
        <div class="cta-btn">
          <span class="cta-text">CONFIGURAR AHORA</span>
          <svg class="cta-arrow" width="12" height="10" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 1L11 5M11 5L7 9M11 5H1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="ad-border"></div>
  </a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
